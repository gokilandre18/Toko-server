<!DOCTYPE html>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Server Multi-Toko - Real-Time Multi-Branch Ledger</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

<body class="min-h-screen bg-black text-gray-100 antialiased selection:bg-emerald-500/30 selection:text-emerald-200">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo, useRef } = React;

        const LOCAL_STORAGE_DB_KEY = 'multi_toko_db_v2';
        const FIREBASE_CONFIG_KEY = 'multi_toko_fb_cfg_v2';
        const BROADCAST_CHANNEL_NAME = 'multi_toko_channel_v2';

        const DEFAULT_STORES = [
            { id: 'toko-1', code: 'TK-01', name: 'Toko Pusat Utama', location: 'Jl. Merdeka No. 1', manager: 'Admin Server' },
            { id: 'toko-2', code: 'TK-02', name: 'Toko Cabang Barat', location: 'Jl. Sudirman No. 45', manager: 'Budi' },
            { id: 'toko-3', code: 'TK-03', name: 'Toko Cabang Timur', location: 'Jl. Ahmad Yani No. 88', manager: 'Siti' }
        ];

        const DAYS_ID = ['minggu', 'senin', 'selasa', 'rabu', 'kamis', 'jumat', 'sabtu'];

        function getTodayISO() {
            const now = new Date();
            const y = now.getFullYear();
            const m = String(now.getMonth() + 1).padStart(2, '0');
            const d = String(now.getDate()).padStart(2, '0');
            return `${y}-${m}-${d}`;
        }

        function getHariName(isoDateStr) {
            const targetISO = isoDateStr || getTodayISO();
            const parts = targetISO.split('-');
            if (parts.length !== 3) return DAYS_ID[new Date().getDay()];
            const dt = new Date(Number(parts[0]), Number(parts[1]) - 1, Number(parts[2]));
            if (Number.isNaN(dt.getTime())) return DAYS_ID[new Date().getDay()];
            return DAYS_ID[dt.getDay()];
        }

        function formatDisplayDate(isoDateStr) {
            const targetISO = isoDateStr || getTodayISO();
            const parts = targetISO.split('-');
            if (parts.length !== 3) return targetISO;
            return `${parts[2]}/${parts[1]}/${parts[0]}`;
        }

        function addDaysISO(isoDateStr, deltaDays) {
            const parts = isoDateStr.split('-');
            const dt = new Date(Number(parts[0]), Number(parts[1]) - 1, Number(parts[2]));
            dt.setDate(dt.getDate() + deltaDays);
            const y = dt.getFullYear();
            const m = String(dt.getMonth() + 1).padStart(2, '0');
            const d = String(dt.getDate()).padStart(2, '0');
            return `${y}-${m}-${d}`;
        }

        function formatRupiah(amount) {
            const num = Number(amount) || 0;
            const isNegative = num < 0;
            const absVal = Math.abs(num);
            const hasFraction = Math.abs(absVal - Math.round(absVal)) > 0.001;
            const formatted = new Intl.NumberFormat('id-ID', {
                minimumFractionDigits: hasFraction ? 1 : 0,
                maximumFractionDigits: hasFraction ? 1 : 0
            }).format(absVal);
            return `${isNegative ? '-' : ''}Rp${formatted}`;
        }

        function formatAvgRupiah(amount) {
            const num = Number(amount) || 0;
            const isNegative = num < 0;
            const absVal = Math.abs(num);
            const rounded = Math.round(absVal);
            const formatted = new Intl.NumberFormat('id-ID', {
                maximumFractionDigits: 0
            }).format(rounded);
            return `${isNegative ? '-' : ''}Rp${formatted}`;
        }

        function computeSimpasan(omzet) {
            const val = Math.max(0, Number(omzet) || 0);
            return {
                s75: val * 0.075,
                s70: val * 0.070,
                s65: val * 0.065,
                s60: val * 0.060
            };
        }

        function computeRowPercent(row) {
            if (!row) return 0;
            if (row.customPercent !== '' && row.customPercent !== undefined && row.customPercent !== null) {
                const parsed = Number(row.customPercent);
                if (!Number.isNaN(parsed)) return Math.max(0, Math.min(100, Math.round(parsed)));
            }
            const omzet = Math.max(0, Number(row.omzet) || 0);
            const belanja = Math.max(0, Number(row.belanja) || 0);
            if (omzet <= 0) return 0;
            return Math.max(0, Math.min(100, Math.round((belanja / omzet) * 100)));
        }

        function getStoreSlug(code) {
            const clean = (code || 'TK-01').toLowerCase().trim().replace(/[^a-z0-9-]/g, '-');
            return `#${clean}`;
        }

        function getFullStoreUrl(code) {
            const hash = getStoreSlug(code);
            try {
                const base = window.location.href.split('#')[0];
                return `${base}${hash}`;
            } catch (e) {
                return hash;
            }
        }

        function buildEmptyRows(endDateISO = getTodayISO(), totalDays = 22) {
            const startISO = addDaysISO(endDateISO, -(totalDays - 1));
            const rows = [];
            for (let i = 0; i < totalDays; i++) {
                const dateStr = addDaysISO(startISO, i);
                rows.push({
                    id: `row-${i + 1}-${dateStr}`,
                    no: i + 1,
                    date: dateStr,
                    day: getHariName(dateStr),
                    omzet: 0,
                    belanja: 0,
                    customPercent: ''
                });
            }
            return rows;
        }

        function buildInitialTransactions(storeList, endDateISO = getTodayISO()) {
            const map = {};
            storeList.forEach((st) => {
                map[st.id] = buildEmptyRows(endDateISO, 22);
            });
            return map;
        }

        // Shared Memory Fallback
        window.__MULTI_TOKO_GLOBAL_STATE__ = window.__MULTI_TOKO_GLOBAL_STATE__ || {
            stores: DEFAULT_STORES,
            transactions: null,
            logs: [],
            updatedAt: Date.now()
        };

        function loadLocalDB() {
            try {
                const raw = localStorage.getItem(LOCAL_STORAGE_DB_KEY);
                if (raw) {
                    const parsed = JSON.parse(raw);
                    if (parsed && Array.isArray(parsed.stores)) {
                        window.__MULTI_TOKO_GLOBAL_STATE__ = parsed;
                        return parsed;
                    }
                }
            } catch (e) {}
            return window.__MULTI_TOKO_GLOBAL_STATE__;
        }

        function App() {
            const [stores, setStores] = useState(() => {
                const db = loadLocalDB();
                return Array.isArray(db.stores) && db.stores.length > 0 ? db.stores : DEFAULT_STORES;
            });

            const [transactionsMap, setTransactionsMap] = useState(() => {
                const db = loadLocalDB();
                if (db.transactions && typeof db.transactions === 'object' && Object.keys(db.transactions).length > 0) {
                    return db.transactions;
                }
                return buildInitialTransactions(DEFAULT_STORES, getTodayISO());
            });

            const [logs, setLogs] = useState(() => {
                const db = loadLocalDB();
                return Array.isArray(db.logs) ? db.logs : [];
            });

            // Firebase Cloud Configuration State
            const [firebaseConfig, setFirebaseConfig] = useState(() => {
                try {
                    const raw = localStorage.getItem(FIREBASE_CONFIG_KEY);
                    if (raw) return JSON.parse(raw);
                } catch (e) {}
                return { dbUrl: '', roomId: 'multi_toko_default' };
            });

            const [showFirebaseModal, setShowFirebaseModal] = useState(false);
            const [isCloudConnected, setIsCloudConnected] = useState(false);

            // Hash detection for branch isolation
            const [urlHash, setUrlHash] = useState(() => (window.location.hash || '').toLowerCase().trim());
            const isBranchMode = useMemo(() => Boolean(urlHash && urlHash !== '#'), [urlHash]);

            // Resolve active store from hash or selection
            const [selectedStoreId, setSelectedStoreId] = useState(() => DEFAULT_STORES[0].id);
            
            const activeStoreId = useMemo(() => {
                if (isBranchMode) {
                    const cleanHash = urlHash.replace(/^#/, '');
                    const matched = stores.find(
                        s => s.code.toLowerCase() === cleanHash ||
                             s.id.toLowerCase() === cleanHash ||
                             s.code.toLowerCase().replace(/[^a-z0-9-]/g, '-') === cleanHash
                    );
                    if (matched) return matched.id;
                }
                return selectedStoreId;
            }, [isBranchMode, urlHash, stores, selectedStoreId]);

            const activeStore = useMemo(() => {
                return stores.find(s => s.id === activeStoreId) || stores[0] || DEFAULT_STORES[0];
            }, [stores, activeStoreId]);

            const [activeTab, setActiveTab] = useState('dashboard'); // 'dashboard' | 'ledger' | 'manage'
            const [searchQuery, setSearchQuery] = useState('');
            const [onlyActiveDays, setOnlyActiveDays] = useState(false);

            // Toast & Sync Indicators
            const [toast, setToast] = useState('');
            const [lastSyncTime, setLastSyncTime] = useState(() => new Date().toLocaleTimeString('id-ID'));
            const [syncPulse, setSyncPulse] = useState(false);

            // Form States for Form Input & Store Management
            const [newDate, setNewDate] = useState(getTodayISO());
            const [newOmzet, setNewOmzet] = useState('');
            const [newBelanja, setNewBelanja] = useState('');
            const [newPercent, setNewPercent] = useState('');

            const [editingStoreId, setEditingStoreId] = useState(null);
            const [editCode, setEditCode] = useState('');
            const [editName, setEditName] = useState('');
            const [editLocation, setEditLocation] = useState('');
            const [editManager, setEditManager] = useState('');

            const chartCanvasRef = useRef(null);
            const chartInstanceRef = useRef(null);
            const broadcastRef = useRef(null);
            const eventSourceRef = useRef(null);

            // Listen to Hash Changes dynamically
            useEffect(() => {
                const onHashChange = () => {
                    setUrlHash((window.location.hash || '').toLowerCase().trim());
                };
                window.addEventListener('hashchange', onHashChange);
                return () => window.removeEventListener('hashchange', onHashChange);
            }, []);

            const showToastMsg = (msg) => {
                setToast(msg);
                setTimeout(() => setToast((prev) => (prev === msg ? '' : prev)), 3200);
            };

            const triggerPulse = () => {
                setLastSyncTime(new Date().toLocaleTimeString('id-ID'));
                setSyncPulse(true);
                setTimeout(() => setSyncPulse(false), 900);
            };

            // Save to Local + Broadcast + Firebase Cloud
            const saveState = (newStores, newTxMap, logMessage = '') => {
                const now = Date.now();
                let updatedLogs = logs;

                if (logMessage) {
                    const entry = {
                        id: `${now}-${Math.random().toString(36).substring(2, 6)}`,
                        time: new Date().toLocaleTimeString('id-ID'),
                        message: logMessage
                    };
                    updatedLogs = [entry, ...logs].slice(0, 30);
                }

                const fullPayload = {
                    stores: newStores || stores,
                    transactions: newTxMap || transactionsMap,
                    logs: updatedLogs,
                    updatedAt: now
                };

                window.__MULTI_TOKO_GLOBAL_STATE__ = fullPayload;
                setStores(fullPayload.stores);
                setTransactionsMap(fullPayload.transactions);
                setLogs(fullPayload.logs);
                triggerPulse();

                try {
                    localStorage.setItem(LOCAL_STORAGE_DB_KEY, JSON.stringify(fullPayload));
                } catch (e) {}

                // BroadcastChannel
                if (broadcastRef.current) {
                    try {
                        broadcastRef.current.postMessage(fullPayload);
                    } catch (e) {}
                }

                // Push to Firebase Cloud if URL is provided
                if (firebaseConfig.dbUrl) {
                    try {
                        const cleanUrl = firebaseConfig.dbUrl.replace(/\/+$/, '');
                        const room = firebaseConfig.roomId || 'multi_toko_default';
                        fetch(`${cleanUrl}/${room}.json`, {
                            method: 'PUT',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify(fullPayload)
                        }).catch(err => console.warn('Firebase PUT err:', err));
                    } catch (e) {}
                }
            };

            // Setup Realtime Sync Engine (Firebase SSE + BroadcastChannel + Polling)
            useEffect(() => {
                let lastTs = 0;

                const applyRemoteState = (remote) => {
                    if (!remote || typeof remote !== 'object') return;
                    if (remote.updatedAt && remote.updatedAt <= lastTs) return;
                    lastTs = remote.updatedAt || Date.now();

                    if (Array.isArray(remote.stores) && remote.stores.length > 0) {
                        setStores(remote.stores);
                    }
                    if (remote.transactions && typeof remote.transactions === 'object') {
                        setTransactionsMap(remote.transactions);
                    }
                    if (Array.isArray(remote.logs)) {
                        setLogs(remote.logs);
                    }
                    triggerPulse();
                };

                // 1. Initial Local Load
                applyRemoteState(loadLocalDB());

                // 2. BroadcastChannel
                try {
                    const bc = new BroadcastChannel(BROADCAST_CHANNEL_NAME);
                    broadcastRef.current = bc;
                    bc.onmessage = (ev) => {
                        if (ev.data) applyRemoteState(ev.data);
                    };
                } catch (e) {}

                // 3. Storage Event
                const handleStorage = (e) => {
                    if (e.key === LOCAL_STORAGE_DB_KEY) {
                        applyRemoteState(loadLocalDB());
                    }
                };
                window.addEventListener('storage', handleStorage);

                // 4. Polling Fallback 500ms for memory check
                const timer = setInterval(() => {
                    const st = loadLocalDB();
                    if (st && st.updatedAt > lastTs) {
                        applyRemoteState(st);
                    }
                }, 500);

                return () => {
                    if (broadcastRef.current) broadcastRef.current.close();
                    window.removeEventListener('storage', handleStorage);
                    clearInterval(timer);
                };
            }, []);

            // Setup Firebase SSE (Server-Sent Events) Stream if dbUrl set
            useEffect(() => {
                if (!firebaseConfig.dbUrl) {
                    setIsCloudConnected(false);
                    return;
                }

                let es = null;
                try {
                    const cleanUrl = firebaseConfig.dbUrl.replace(/\/+$/, '');
                    const room = firebaseConfig.roomId || 'multi_toko_default';
                    const streamUrl = `${cleanUrl}/${room}.json`;
                    
                    es = new EventSource(streamUrl);
                    eventSourceRef.current = es;

                    es.onopen = () => {
                        setIsCloudConnected(true);
                    };

                    es.onerror = () => {
                        setIsCloudConnected(false);
                    };

                    es.addEventListener('put', (e) => {
                        try {
                            const parsed = JSON.parse(e.data);
                            if (parsed && parsed.data) {
                                if (parsed.path === '/') {
                                    const payload = parsed.data;
                                    if (payload.stores && payload.transactions) {
                                        window.__MULTI_TOKO_GLOBAL_STATE__ = payload;
                                        setStores(payload.stores);
                                        setTransactionsMap(payload.transactions);
                                        if (payload.logs) setLogs(payload.logs);
                                        triggerPulse();
                                        setIsCloudConnected(true);
                                    }
                                }
                            }
                        } catch (err) {}
                    });
                } catch (err) {
                    setIsCloudConnected(false);
                }

                return () => {
                    if (es) es.close();
                };
            }, [firebaseConfig.dbUrl, firebaseConfig.roomId]);

            // Data Computed Properties
            const currentRows = useMemo(() => {
                const rows = transactionsMap[activeStore.id];
                if (Array.isArray(rows) && rows.length > 0) return rows;
                return buildEmptyRows(getTodayISO(), 22);
            }, [transactionsMap, activeStore.id]);

            const filteredRows = useMemo(() => {
                const q = searchQuery.trim().toLowerCase();
                return currentRows.filter((r) => {
                    const omzet = Number(r.omzet) || 0;
                    const belanja = Number(r.belanja) || 0;
                    if (onlyActiveDays && omzet <= 0 && belanja <= 0) return false;
                    if (!q) return true;
                    const dispDate = formatDisplayDate(r.date).toLowerCase();
                    const dayStr = (r.day || '').toLowerCase();
                    return (
                        dispDate.includes(q) ||
                        (r.date || '').toLowerCase().includes(q) ||
                        dayStr.includes(q) ||
                        String(omzet).includes(q) ||
                        String(belanja).includes(q)
                    );
                });
            }, [currentRows, searchQuery, onlyActiveDays]);

            const summary = useMemo(() => {
                let totalOmzet = 0;
                let totalBelanja = 0;
                let totalS75 = 0;
                let totalS70 = 0;
                let totalS65 = 0;
                let totalS60 = 0;
                let activeDaysCount = 0;
                let percentSum = 0;

                currentRows.forEach((r) => {
                    const omzet = Math.max(0, Number(r.omzet) || 0);
                    const belanja = Math.max(0, Number(r.belanja) || 0);
                    const sim = computeSimpasan(omzet);
                    const pct = computeRowPercent(r);

                    totalOmzet += omzet;
                    totalBelanja += belanja;
                    totalS75 += sim.s75;
                    totalS70 += sim.s70;
                    totalS65 += sim.s65;
                    totalS60 += sim.s60;
                    percentSum += pct;
                    if (omzet > 0 || belanja > 0) activeDaysCount += 1;
                });

                const avgOmzet = activeDaysCount > 0 ? totalOmzet / activeDaysCount : 0;
                const avgS75 = activeDaysCount > 0 ? totalS75 / activeDaysCount : 0;
                const avgS70 = activeDaysCount > 0 ? totalS70 / activeDaysCount : 0;
                const avgS65 = activeDaysCount > 0 ? totalS65 / activeDaysCount : 0;
                const avgS60 = activeDaysCount > 0 ? totalS60 / activeDaysCount : 0;
                const avgPercent = currentRows.length > 0 ? Math.round(percentSum / currentRows.length) : 0;
                const netDiff = totalOmzet - totalBelanja - totalS75;

                return {
                    totalOmzet, totalBelanja, totalS75, totalS70, totalS65, totalS60,
                    activeDaysCount, avgOmzet, avgS75, avgS70, avgS65, avgS60,
                    avgPercent, netDiff
                };
            }, [currentRows]);

            const multiStoreSummary = useMemo(() => {
                return stores.map((st) => {
                    const rows = Array.isArray(transactionsMap[st.id]) ? transactionsMap[st.id] : [];
                    let omzet = 0;
                    let belanja = 0;
                    let s75 = 0;
                    let days = 0;

                    rows.forEach((r) => {
                        const o = Math.max(0, Number(r.omzet) || 0);
                        const b = Math.max(0, Number(r.belanja) || 0);
                        const sim = computeSimpasan(o);
                        omzet += o;
                        belanja += b;
                        s75 += sim.s75;
                        if (o > 0 || b > 0) days += 1;
                    });

                    const avgOmzet = days > 0 ? omzet / days : 0;
                    const net = omzet - belanja - s75;
                    return { store: st, days, avgOmzet, omzet, s75, belanja, net };
                });
            }, [stores, transactionsMap]);

            const grandTotals = useMemo(() => {
                return multiStoreSummary.reduce(
                    (acc, item) => {
                        acc.omzet += item.omzet;
                        acc.s75 += item.s75;
                        acc.belanja += item.belanja;
                        acc.days += item.days;
                        acc.net += item.net;
                        return acc;
                    },
                    { omzet: 0, s75: 0, belanja: 0, days: 0, net: 0 }
                );
            }, [multiStoreSummary]);

            // Render Chart.js on Server Dashboard
            useEffect(() => {
                if (isBranchMode || activeTab !== 'dashboard' || !chartCanvasRef.current || typeof Chart === 'undefined') {
                    return;
                }
                if (chartInstanceRef.current) {
                    chartInstanceRef.current.destroy();
                }

                const ctx = chartCanvasRef.current.getContext('2d');
                chartInstanceRef.current = new Chart(ctx, {
                    type: 'bar',
                    data: {
                        labels: multiStoreSummary.map((m) => `${m.store.code} (${m.store.name})`),
                        datasets: [
                            {
                                label: 'Total Omset',
                                data: multiStoreSummary.map((m) => m.omzet),
                                backgroundColor: '#3b82f6',
                                borderRadius: 6
                            },
                            {
                                label: 'Simpasan 7.5%',
                                data: multiStoreSummary.map((m) => m.s75),
                                backgroundColor: '#10b981',
                                borderRadius: 6
                            },
                            {
                                label: 'Total Belanja',
                                data: multiStoreSummary.map((m) => m.belanja),
                                backgroundColor: '#a855f7',
                                borderRadius: 6
                            }
                        ]
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: false,
                        plugins: {
                            legend: { labels: { color: '#e5e7eb', font: { family: 'Inter', size: 12 } } }
                        },
                        scales: {
                            x: { ticks: { color: '#9ca3af' }, grid: { color: '#232329' } },
                            y: {
                                ticks: {
                                    color: '#9ca3af',
                                    callback: (v) => 'Rp' + Number(v).toLocaleString('id-ID')
                                },
                                grid: { color: '#232329' }
                            }
                        }
                    }
                });

                return () => {
                    if (chartInstanceRef.current) {
                        chartInstanceRef.current.destroy();
                        chartInstanceRef.current = null;
                    }
                };
            }, [isBranchMode, activeTab, multiStoreSummary]);

            // Ledger Transaction Handlers
            const handleInlineUpdate = (rowId, field, val) => {
                const updatedRows = currentRows.map((r) => {
                    if (r.id !== rowId) return r;
                    if (field === 'date') return { ...r, date: val, day: getHariName(val) };
                    if (field === 'omzet' || field === 'belanja') {
                        const num = val === '' ? 0 : Math.max(0, Number(val) || 0);
                        return { ...r, [field]: num };
                    }
                    return { ...r, [field]: val };
                });
                const nextMap = { ...transactionsMap, [activeStore.id]: updatedRows };
                saveState(stores, nextMap, `${activeStore.code} ubah ${field}`);
            };

            const handleSaveTransactionForm = (e) => {
                e.preventDefault();
                const targetDate = newDate || getTodayISO();
                const omzVal = Math.max(0, Number(newOmzet) || 0);
                const bljVal = Math.max(0, Number(newBelanja) || 0);
                const pctVal = newPercent === '' ? '' : Math.max(0, Math.min(100, Number(newPercent) || 0));

                const idx = currentRows.findIndex(r => r.date === targetDate);
                let updatedRows = [];

                if (idx >= 0) {
                    updatedRows = currentRows.map((r, i) =>
                        i === idx ? { ...r, day: getHariName(targetDate), omzet: omzVal, belanja: bljVal, customPercent: pctVal } : r
                    );
                } else {
                    updatedRows = [
                        ...currentRows,
                        {
                            id: `row-${Date.now()}`,
                            no: currentRows.length + 1,
                            date: targetDate,
                            day: getHariName(targetDate),
                            omzet: omzVal,
                            belanja: bljVal,
                            customPercent: pctVal
                        }
                    ];
                }

                const nextMap = { ...transactionsMap, [activeStore.id]: updatedRows };
                saveState(stores, nextMap, `${activeStore.code} input ${formatDisplayDate(targetDate)}: Omset ${formatRupiah(omzVal)}`);
                setNewOmzet('');
                setNewBelanja('');
                setNewPercent('');
                showToastMsg(`Data ${formatDisplayDate(targetDate)} berhasil disimpan.`);
            };

            const handleAddNextRow = () => {
                const lastRow = currentRows[currentRows.length - 1];
                const nextDate = lastRow && lastRow.date ? addDaysISO(lastRow.date, 1) : getTodayISO();
                const nextNo = currentRows.length + 1;
                const updatedRows = [
                    ...currentRows,
                    {
                        id: `row-${Date.now()}-${nextNo}`,
                        no: nextNo,
                        date: nextDate,
                        day: getHariName(nextDate),
                        omzet: 0,
                        belanja: 0,
                        customPercent: ''

                const updatedRows = currentRows.map((r) =>
                    r.id === rowId ? { ...r, omzet: 0, belanja: 0, customPercent: '' } : r
                );
                const nextMap = { ...transactionsMap, [activeStore.id]: updatedRows };
                saveState(stores, nextMap, `${activeStore.code} kosongkan baris`);
            };

            const handleDeleteRow = (rowId) => {
                if (currentRows.length <= 1) {
                    handleClearRow(rowId);
                    return;
                }
                const filtered = currentRows.filter(r => r.id !== rowId).map((r, i) => ({ ...r, no: i + 1 }));
                const nextMap = { ...transactionsMap, [activeStore.id]: filtered };
                saveState(stores, nextMap, `${activeStore.code} hapus baris`);
            };

                const fullUrl = getFullStoreUrl(st.code);

                    const ta = document.createElement('textarea');
                    ta.value = fullUrl;
                    ta.style.position = 'fixed';
                    ta.style.opacity = '0';
                    document.body.appendChild(ta);
                    ta.select();
                    document.execCommand('copy');
                    document.body.removeChild(ta);

        class ErrorBoundary extends React.Component {
            constructor(props) {
                super(props);
                this.state = { hasError: false, error: null };
            }
            static getDerivedStateFromError(error) {
                return { hasError: true, error };
            }
            componentDidCatch(error, errorInfo) {
                console.error("ErrorBoundary caught an error:", error, errorInfo);
            }
            render() {
                if (this.state.hasError) {
                    return (
                        <div className="min-h-screen bg-black text-white flex items-center justify-center p-6">
                            <div className="max-w-md w-full bg-[#0a0a0c] border border-rose-800 rounded-2xl p-6 space-y-4 text-center">
                                <div className="text-3xl">⚠️</div>
                                <h2 className="text-lg font-bold text-rose-400">Terjadi Kesalahan Aplikasi</h2>
                                <p className="text-xs text-gray-300 bg-black p-3 rounded-xl border border-[#232329] text-left font-mono">
                                    {this.state.error?.message || 'Gagal memuat komponen.'}
                                </p>
                                <button
                                    type="button"
                                    onClick={() => window.location.reload()}
                                    className="px-4 py-2 rounded-xl bg-blue-600 hover:bg-blue-500 text-white text-xs font-bold cursor-pointer transition"
                                >
                                    Muat Ulang Halaman
                                </button>
                            </div>
                        </div>
                    );
                }
                return this.props.children;
            }
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(
            <ErrorBoundary>
                <App />
            </ErrorBoundary>
        );
    </script>
